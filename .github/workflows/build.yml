name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          # Qt >= 6.8 uses a new download-server layout that the action's
          # default aqtinstall (3.1.*) cannot parse
          aqtversion: '==3.3.*'
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          # Make Qt's MinGW toolchain (and its runtime DLLs) available on PATH
          Add-Content -Path $env:GITHUB_PATH -Value "$env:IQTA_TOOLS/mingw1310_64/bin"
          $env:Path = "$env:IQTA_TOOLS/mingw1310_64/bin;$env:Path"

          $versionArg = @()
          if ("$env:GITHUB_REF".StartsWith('refs/tags/')) {
            $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
            $version = $version.Split('-')[0]
            $versionArg = @("-DAPP_VERSION=$version")
          }

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_C_COMPILER="$env:IQTA_TOOLS/mingw1310_64/bin/gcc.exe" `
            -DCMAKE_CXX_COMPILER="$env:IQTA_TOOLS/mingw1310_64/bin/c++.exe" `
            @versionArg

      - name: Build
        run: cmake --build build

      - name: Package (NSIS installer)
        run: cmake --build build --target package

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/EtherCATAliasTool-*-win64.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential qt6-base-dev libgl1-mesa-dev dpkg-dev file

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure
        shell: bash
        run: |
          VERSION_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION="${VERSION%%-*}"
            VERSION_ARG="-DAPP_VERSION=$VERSION"
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $VERSION_ARG

      - name: Build
        run: cmake --build build

      - name: Package (.deb)
        run: cmake --build build --target package

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: build/ethercat-alias-tool_*_amd64.deb

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
